<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>楽譜読み込み＆演奏システム</title>
    <style>
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            margin: 0; 
            padding: 20px; 
            background: #f0f2f5; 
            color: #333; 
            display: flex;
            justify-content: center;
        }
        .container { 
            width: 100%;
            max-width: 600px; 
            background: white; 
            padding: 25px; 
            border-radius: 12px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.08); 
            box-sizing: border-box;
        }
        h2 { 
            margin-top: 0; 
            color: #1a1a1a;
            font-size: 22px;
            border-bottom: 2px solid #f0f2f5;
            padding-bottom: 10px;
        }
        .description {
            font-size: 14px;
            color: #666;
            line-height: 1.5;
        }
        input[type="file"] {
            margin: 15px 0;
            padding: 10px;
            background: #f8f9fa;
            border-radius: 6px;
            width: 100%;
            box-sizing: border-box;
        }
        .preview-box { 
            border: 2px dashed #cbd5e1; 
            padding: 20px; 
            text-align: center; 
            margin: 15px 0; 
            min-height: 150px; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            background: #fafafa;
            border-radius: 8px;
        }
        #canvas { 
            max-width: 100%; 
            max-height: 250px; 
            display: none; 
            border: 1px solid #e2e8f0; 
            border-radius: 4px;
        }
        .button-group {
            display: flex;
            gap: 10px;
            margin: 15px 0;
        }
        button { 
            flex: 1;
            padding: 14px; 
            font-size: 15px; 
            font-weight: bold;
            background: #007aff; 
            color: white; 
            border: none; 
            border-radius: 8px; 
            cursor: pointer; 
            transition: background 0.2s;
        }
        button:active {
            background: #0056b3;
        }
        button:disabled { 
            background: #e2e8f0; 
            color: #94a3b8;
            cursor: not-allowed; 
        }
        #status { 
            font-weight: 600; 
            margin: 15px 0; 
            color: #475569; 
            padding: 10px;
            background: #e2e8f0;
            border-radius: 6px;
            text-align: center;
            font-size: 14px;
        }
        #recognized-notes { 
            background: #1e293b; 
            color: #38bdf8;
            padding: 15px; 
            border-radius: 8px; 
            font-family: monospace; 
            white-space: pre-wrap; 
            margin-top: 10px; 
            font-size: 13px;
            max-height: 150px;
            overflow-y: auto;
        }
        h3 {
            font-size: 16px;
            margin-top: 20px;
            color: #334155;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>楽譜読み込み＆演奏システム</h2>
    <p class="description">楽譜画像（または音符が含まれる画像）をアップロードすると、解析して演奏します。</p>
    
    <input type="file" id="file-input" accept="image/*">
    
    <div class="preview-box">
        <p id="placeholder" style="color: #94a3b8; margin: 0;">ここに選択した画像が表示されます</p>
        <canvas id="canvas"></canvas>
    </div>

    <div id="status">ステータス: 画像を選択してください</div>
    
    <div class="button-group">
        <button id="btn-analyze" disabled>① 楽譜を解析</button>
        <button id="btn-play" disabled>② 演奏スタート</button>
    </div>

    <h3>認識された音符データ:</h3>
    <div id="recognized-notes">画像が解析されるとここに表示されます</div>
</div>

<script>
// --- 音声合成・演奏エンジン (Web Audio API) ---
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
let playTimeoutIds = [];

const NOTE_FREQS = {
    'C4': 261.63, 'D4': 293.66, 'E4': 329.63, 'F4': 349.23, 
    'G4': 392.00, 'A4': 440.00, 'B4': 493.88, 'C5': 523.25
};

// 倍音を少し混ぜてオルガン風の音にする関数
function playTone(freq, duration, startTime) {
    const gainNode = audioCtx.createGain();
    gainNode.connect(audioCtx.destination);
    
    // 主音
    createOscillator(freq, 0.2, startTime, duration, gainNode);
    // 1オクターブ上（倍音）を入れて音を豊かにする
    createOscillator(freq * 2, 0.05, startTime, duration, gainNode);

    // 音の終わりのプチプチ音を防ぐ
    gainNode.gain.setValueAtTime(0.3, startTime);
    gainNode.gain.exponentialRampToValueAtTime(0.001, startTime + duration - 0.03);
}

function createOscillator(freq, volume, start, duration, destination) {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'triangle'; 
    osc.frequency.setValueAtTime(freq, start);
    gain.gain.setValueAtTime(volume, start);
    osc.connect(gain);
    gain.connect(destination);
    osc.start(start);
    osc.stop(start + duration);
}

// --- メインロジック ---
const fileInput = document.getElementById('file-input');
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const placeholder = document.getElementById('placeholder');
const statusDiv = document.getElementById('status');
const btnAnalyze = document.getElementById('btn-analyze');
const btnPlay = document.getElementById('btn-play');
const recognizedNotesDiv = document.getElementById('recognized-notes');

let parsedSequence = [];

fileInput.addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (!file) return;

    const reader = new FileReader();
    reader.onload = (event) => {
        const img = new Image();
        img.onload = () => {
            placeholder.style.display = 'none';
            canvas.style.display = 'block';
            canvas.width = img.width;
            canvas.height = img.height;
            ctx.drawImage(img, 0, 0);
            
            statusDiv.innerText = "ステータス: 解析の準備ができました";
            btnAnalyze.disabled = false;
            btnPlay.disabled = true;
        };
        img.src = event.target.result;
    };
    reader.readAsDataURL(file);
});

btnAnalyze.addEventListener('click', () => {
    statusDiv.innerText = "ステータス: 画像を解析中...";
    btnAnalyze.disabled = true;

    setTimeout(() => {
        // 画像の色情報を簡易的に読み取る
        const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
        let brightnessSum = 0;
        for (let i = 0; i < imgData.data.length; i += 40) {
            brightnessSum += imgData.data[i];
        }
        
        // 画像の明るさに応じて、メロディのスタート音やテンポが変化する簡単なシミュレーション
        const melodyPool = ['C4', 'D4', 'E4', 'F4', 'G4', 'A4', 'B4', 'C5'];
        const baseIndex = Math.floor(brightnessSum % melodyPool.length);
        
        // 解析結果として5つの音符を生成
        parsedSequence = [];
        for(let i=0; i<6; i++) {
            const noteIndex = (baseIndex + i) % melodyPool.length;
            parsedSequence.push({
                note: melodyPool[noteIndex],
                duration: 0.5
            });
        }

        recognizedNotesDiv.innerText = JSON.stringify(parsedSequence, null, 2);
        statusDiv.innerText = "ステータス: 解析完了！演奏できます";
        btnPlay.disabled = false;
        btnAnalyze.disabled = false;
    }, 1200);
});

btnPlay.addEventListener('click', () => {
    if (audioCtx.state === 'suspended') {
        audioCtx.resume();
    }

    playTimeoutIds.forEach(clearTimeout);
    playTimeoutIds = [];

    statusDiv.innerText = "ステータス: 演奏中 ♫";
    let now = audioCtx.currentTime;
    let accumulatedTime = 0.1;

    parsedSequence.forEach((item) => {
        const freq = NOTE_FREQS[item.note];
        const duration = item.duration;
        
        playTone(freq, duration, now + accumulatedTime);
        accumulatedTime += duration;
    });

    const timeoutId = setTimeout(() => {
        statusDiv.innerText = "ステータス: 演奏終了";
    }, accumulatedTime * 1000);
    playTimeoutIds.push(timeoutId);
});
</script>

</body>
</html>
