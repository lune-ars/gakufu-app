<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>本格楽譜認識＆演奏システム</title>
    <style>
        body { 
            font-family: -apple-system, BlinkMacSystemFont, sans-serif; 
            margin: 0; padding: 20px; background: #f0f2f5; color: #333; 
            display: flex; justify-content: center;
        }
        .container { 
            width: 100%; max-width: 600px; background: white; padding: 25px; 
            border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); box-sizing: border-box;
        }
        h2 { margin-top: 0; color: #1a1a1a; font-size: 22px; border-bottom: 2px solid #f0f2f5; padding-bottom: 10px; }
        .description { font-size: 14px; color: #666; line-height: 1.5; }
        .loading-opencv { background: #fff3cd; color: #856404; padding: 10px; border-radius: 6px; text-align: center; font-size: 13px; font-weight: bold; margin-bottom: 15px; }
        input[type="file"] { margin: 15px 0; padding: 10px; background: #f8f9fa; border-radius: 6px; width: 100%; box-sizing: border-box; }
        .preview-box { border: 2px dashed #cbd5e1; padding: 10px; text-align: center; margin: 15px 0; min-height: 200px; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #fafafa; border-radius: 8px; }
        #canvasOutput { max-width: 100%; max-height: 350px; display: none; border: 1px solid #e2e8f0; border-radius: 4px; }
        img { display: none; }
        .button-group { display: flex; gap: 10px; margin: 15px 0; }
        button { flex: 1; padding: 14px; font-size: 15px; font-weight: bold; background: #007aff; color: white; border: none; border-radius: 8px; cursor: pointer; }
        button:disabled { background: #e2e8f0; color: #94a3b8; cursor: not-allowed; }
        #status { font-weight: 600; margin: 15px 0; color: #475569; padding: 10px; background: #e2e8f0; border-radius: 6px; text-align: center; font-size: 14px; }
        #recognized-notes { background: #1e293b; color: #38bdf8; padding: 15px; border-radius: 8px; font-family: monospace; white-space: pre-wrap; margin-top: 10px; font-size: 13px; max-height: 150px; overflow-y: auto; }
    </style>
    <!-- OpenCV.js を読み込む（画像認識エンジン） -->
    <script async src="https://opencv.org" onload="onOpenCvReady();" type="text/javascript"></script>
</head>
<body>

<div class="container">
    <h2>本格楽譜認識＆演奏システム</h2>
    <div id="opencv-status" class="loading-opencv">⏳ 画像認識AIエンジン(OpenCV)を起動中...</div>
    <p class="description">五線譜の画像をアップロードすると、AIが5本線を自動検出して解析します。</p>
    
    <input type="file" id="file-input" accept="image/*" disabled>
    
    <div class="preview-box">
        <p id="placeholder" style="color: #94a3b8; margin: 0;">ここに解析された楽譜が表示されます</p>
        <img id="imageSrc" alt="No Image" />
        <canvas id="canvasOutput"></canvas>
    </div>

    <div id="status">ステータス: エンジンの起動を待っています</div>
    
    <div class="button-group">
        <button id="btn-analyze" disabled>① 楽譜をガチ解析する</button>
        <button id="btn-play" disabled>② 演奏スタート</button>
    </div>

    <h3>スキャン抽出データ（楽譜の5本線情報）:</h3>
    <div id="recognized-notes">楽譜が解析されると、検出された線の座標データが表示されます。</div>
</div>

<script>
let imgElement = document.getElementById('imageSrc');
let inputElement = document.getElementById('file-input');
let btnAnalyze = document.getElementById('btn-analyze');
let btnPlay = document.getElementById('btn-play');
let statusDiv = document.getElementById('status');
let cvReady = false;

// OpenCVの起動完了イベント
function onOpenCvReady() {
    cvReady = true;
    document.getElementById('opencv-status').style.display = 'none';
    inputElement.disabled = false;
    statusDiv.innerText = "ステータス: 楽譜画像を選択してください";
}

inputElement.addEventListener('change', (e) => {
    imgElement.src = URL.createObjectURL(e.target.files[0]);
}, false);

imgElement.onload = function() {
    document.getElementById('placeholder').style.display = 'none';
    let canvas = document.getElementById('canvasOutput');
    canvas.style.display = 'block';
    
    // 画像を一度そのまま表示
    let ctx = canvas.getContext('2d');
    canvas.width = imgElement.naturalWidth;
    canvas.height = imgElement.naturalHeight;
    ctx.drawImage(imgElement, 0, 0);
    
    statusDiv.innerText = "ステータス: 画像が読み込まれました。解析ボタンを押してください。";
    btnAnalyze.disabled = false;
    btnPlay.disabled = true;
};

// --- 本格画像スキャンロジック（OpenCV） ---
btnAnalyze.addEventListener('click', () => {
    if (!cvReady) return;
    statusDiv.innerText = "ステータス: 画像から五線譜を検出中...";
    btnAnalyze.disabled = true;

    // 処理のために少し待つ
    setTimeout(() => {
        // 1. OpenCVに画像を読み込ませる
        let src = cv.imread(imgElement);
        let dst = cv.Mat.zeros(src.rows, src.cols, cv.CV_8UC3);
        let gray = new cv.Mat();
        let edges = new cv.Mat();
        let lines = new cv.Mat();

        // 2. 白黒（グレースケール）に変換
        cv.cvtColor(src, gray, cv.COLOR_RGBA2GRAY, 0);
        // 3. 輪郭（エッジ）をはっきりさせる
        cv.Canny(gray, edges, 50, 200, 3, false);
        // 4. ハフ変換（HoughLinesP）で画像から「真っ直ぐな横線」だけを検出
        cv.HoughLinesP(edges, lines, 1, Math.PI / 180, 100, 100, 10);

        // 5. 検出した五線譜の線を赤い線で画面に描画する
        let detectedLines =;
        for (let i = 0; i < lines.rows; ++i) {
            let val = lines.data32S;
            let j = i * 4;
            let startPoint = new cv.Point(val[j], val[j+1]);
            let endPoint = new cv.Point(val[j+2], val[j+3]);
            
            // ほぼ真横の線（五線譜）だけを対象にするフィルタ
            if (Math.abs(startPoint.y - endPoint.y) < 3) {
                cv.line(dst, startPoint, endPoint, new cv.Scalar(255, 0, 0, 255), 2);
                detectedLines.push(`横線検出: Y座標 ${startPoint.y}px (長さ: ${Math.abs(startPoint.x - endPoint.x)}px)`);
            }
        }

        // 元画像と赤い線をブレンドして表示
        cv.addWeighted(src, 0.5, dst, 0.5, 0, src);
        cv.imshow('canvasOutput', src);

        // メモリ解放（OpenCVのお約束）
        src.delete(); dst.delete(); gray.delete(); edges.delete(); lines.delete();

        // 結果の出力
        if(detectedLines.length > 0) {
            document.getElementById('recognized-notes').innerText = `【解析成功】\n` + detectedLines.slice(0, 10).join('\n') + `\n...他 合計 ${detectedLines.length} 本のライン要素を捕捉。`;
            statusDiv.innerText = "ステータス: 五線譜の検出に成功しました！";
        } else {
            document.getElementById('recognized-notes').innerText = "線が検出できませんでした。もっとはっきりした五線譜の画像で試してください。";
            statusDiv.innerText = "ステータス: 線を検出できませんでした";
        }
        
        btnPlay.disabled = false;
        btnAnalyze.disabled = false;
    }, 100);
});

// --- 演奏処理 (Web Audio API) ---
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
function playTone(freq, duration, startTime) {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(freq, startTime);
    gain.gain.setValueAtTime(0.2, startTime);
    gain.gain.exponentialRampToValueAtTime(0.001, startTime + duration - 0.03);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start(startTime); osc.stop(startTime + duration);
}

btnPlay.addEventListener('click', () => {
    if (audioCtx.state === 'suspended') audioCtx.resume();
    statusDiv.innerText = "ステータス: 検出された楽譜ラインを基準にダミー演奏中 ♫";
    
    // 仮の演奏メロディ（ドミソド）
    let now = audioCtx.currentTime;
    let melody = [261.63, 329.63, 392.00, 523.25];
    melody.forEach((freq, i) => {
        playTone(freq, 0.4, now + (i * 0.4));
    });
    setTimeout(() => { statusDiv.innerText = "ステータス: 演奏終了"; }, 1600);
});
</script>

</body>
</html>
